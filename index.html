<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#097b8f">
<title>Seguros Nur | Sistema de Turnos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --azul: #097b8f;
  --azul-oscuro: #075c6c;
  --dorado: #d0a862;
  --fondo: #f4f7f6;
  --blanco: #fff;
  --texto: #24383d;
  --gris: #748489;
  --borde: #dfe8e7;
  --verde: #218653;
  --rojo: #c34242;
  --sombra: 0 8px 26px rgba(10, 57, 66, .09);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: "Segoe UI", Arial, sans-serif;
  color: var(--texto);
  background: var(--fondo);
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .6;
}

.hidden {
  display: none !important;
}

/* CABECERA CORPORATIVA */

.main-header {
  min-height: 78px;
  padding: 12px 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: var(--blanco);
  border-bottom: 3px solid var(--azul);
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
}

.logo {
  height: 46px;
  width: auto;
  max-width: 135px;
  object-fit: contain;
}

.brand h1 {
  margin: 0 0 4px;
  color: var(--azul);
  font-size: 24px;
  line-height: 1.1;
}

.brand p {
  margin: 0;
  color: var(--gris);
  font-size: 12px;
}

.header-link {
  text-decoration: none;
  color: var(--azul);
  border: 1px solid var(--borde);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 12px;
  white-space: nowrap;
}

/* VISTAS CLIENTE Y ASESOR */

.page {
  width: min(100%, 1100px);
  margin: auto;
  padding: 30px 20px 40px;
}

.heading {
  text-align: center;
  margin: 0 auto 24px;
}

.eyebrow {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--azul);
}

.heading h2 {
  margin: 9px 0;
  color: var(--azul-oscuro);
  font-size: clamp(25px, 4vw, 35px);
}

.heading p {
  color: var(--gris);
  font-size: 14px;
  line-height: 1.6;
  margin: 0;
}

.card {
  max-width: 570px;
  margin: auto;
  padding: 27px;
  background: var(--blanco);
  border: 1px solid var(--borde);
  border-radius: 12px;
  box-shadow: var(--sombra);
}

.field {
  margin-bottom: 20px;
}

.field label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 9px;
}

.field select,
.field input {
  width: 100%;
  min-height: 48px;
  padding: 13px;
  border: 1px solid #ccd9d9;
  border-radius: 8px;
  background: #fff;
  color: var(--texto);
  outline: none;
}

.field select:focus,
.field input:focus {
  border-color: var(--azul);
  box-shadow: 0 0 0 3px #097b8f1c;
}

.btn {
  width: 100%;
  min-height: 51px;
  border: 0;
  border-radius: 9px;
  padding: 14px 18px;
  font-size: 14px;
  font-weight: 800;
}

.btn-gold {
  background: var(--dorado);
  color: #243238;
}

.btn-gold:hover:not(:disabled) {
  background: #bd974f;
}

.btn-blue {
  background: var(--azul);
  color: #fff;
}

.btn-blue:hover:not(:disabled) {
  background: var(--azul-oscuro);
}

.btn-light {
  background: #edf3f3;
  color: var(--azul-oscuro);
}

.helper {
  margin: 16px 0 0;
  color: var(--gris);
  font-size: 12px;
  line-height: 1.65;
  text-align: center;
}

.alert {
  margin-top: 15px;
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.alert.error {
  color: #922f2f;
  background: #fff0f0;
  border: 1px solid #f0d0d0;
}

.alert.success {
  color: #17643c;
  background: #ecf8f0;
  border: 1px solid #ccebd8;
}

.alert.info {
  color: #155d69;
  background: #eaf6f7;
  border: 1px solid #c9e7ea;
}

.ticket-result {
  margin-top: 22px;
  padding: 25px 15px;
  border: 1px solid #ead7b3;
  border-radius: 12px;
  background: #fffaf1;
  text-align: center;
}

.ticket-result .label {
  color: #80632e;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.5px;
}

.ticket-result .code {
  color: var(--dorado);
  font-size: clamp(45px, 10vw, 70px);
  font-weight: 900;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.ticket-result p {
  color: var(--gris);
  font-size: 13px;
  line-height: 1.5;
}

.status-line {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  color: var(--gris);
  margin-bottom: 20px;
}

.dot {
  width: 9px;
  height: 9px;
  flex: 0 0 9px;
  border-radius: 50%;
  background: var(--verde);
}

.dot.offline {
  background: var(--rojo);
}

.current-advisor {
  margin: 22px 0;
  padding: 21px 12px;
  text-align: center;
  background: #edf6f6;
  border: 1px solid #d8eaea;
  border-radius: 10px;
}

.current-advisor .label {
  color: var(--gris);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.current-advisor .code {
  color: var(--azul);
  font-size: 44px;
  font-weight: 900;
  margin: 10px 0;
}

footer {
  padding: 18px;
  color: var(--gris);
  font-size: 11px;
  text-align: center;
}

/* PANTALLA DE AUDITORIO: 100VH SIN SCROLL */

body.screen-mode {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
}

body.screen-mode .main-header,
body.screen-mode footer {
  display: none !important;
}

body.screen-mode #app {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
}

.auditorium {
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  background: var(--fondo);
}

.video-column {
  min-width: 0;
  min-height: 0;
  height: 100%;
  overflow: hidden;
  padding: 12px;
  background: #092f38;
  display: flex;
}

.video-player {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 12px;
  background: #10282e;
}

.video-message {
  position: absolute;
  left: 25px;
  right: 25px;
  bottom: 25px;
  padding: 10px;
  color: white;
  background: #0009;
  border-radius: 8px;
  font-size: 12px;
  text-align: center;
  pointer-events: none;
}

.video-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  border-radius: 12px;
}

.turns-column {
  height: 100%;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  padding: clamp(12px, 2vh, 22px) clamp(12px, 1.6vw, 24px);
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  gap: clamp(8px, 1.4vh, 15px);
}

/* CABECERA DERECHA: LOGO + RELOJ */

.screen-top {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--azul);
}

.screen-brand {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
}

.screen-brand .logo {
  height: clamp(29px, 5vh, 44px);
  max-width: 95px;
}

.screen-brand h1 {
  margin: 0 0 3px;
  color: var(--azul);
  font-size: clamp(16px, 1.8vw, 24px);
}

.screen-brand p {
  margin: 0;
  color: var(--gris);
  font-size: clamp(8px, .8vw, 11px);
  line-height: 1.3;
}

.clock {
  text-align: right;
  flex-shrink: 0;
}

.clock-time {
  color: var(--azul-oscuro);
  font-size: clamp(18px, 2vw, 29px);
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  letter-spacing: .5px;
}

.clock-date {
  margin-top: 3px;
  color: var(--gris);
  font-size: clamp(8px, .8vw, 11px);
  text-transform: capitalize;
}

/* TURNO ACTUAL */

.turn-current {
  min-height: 0;
  background: var(--azul);
  color: white;
  border-radius: 12px;
  padding: clamp(10px, 2vh, 20px) 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: var(--sombra);
}

.turn-current .overline {
  color: #e9f3f4;
  font-size: clamp(10px, 1vw, 13px);
  font-weight: 800;
  letter-spacing: 2px;
}

.turn-current .current-code {
  color: var(--dorado);
  font-size: clamp(40px, 6vw, 84px);
  font-weight: 900;
  line-height: 1.05;
  margin: 7px 0;
  overflow-wrap: anywhere;
}

.turn-current .current-mesa {
  color: var(--dorado);
  font-size: clamp(18px, 2.6vw, 35px);
  font-weight: 900;
  letter-spacing: 1px;
}

.turn-current .current-placeholder {
  font-size: clamp(22px, 3vw, 42px);
  font-weight: 700;
  color: #d7e6e8;
  margin: 8px 0;
}

.turn-current .current-caption {
  color: #e2eff0;
  font-size: clamp(9px, .9vw, 12px);
  margin-top: 6px;
}

/* HISTORIAL */

.history-panel {
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.history-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.history-title h2 {
  margin: 0;
  color: var(--azul-oscuro);
  font-size: clamp(11px, 1.15vw, 16px);
  letter-spacing: .4px;
}

.history-title span {
  color: var(--gris);
  font-size: clamp(8px, .8vw, 10px);
}

.history-table-wrap {
  min-height: 0;
  flex: 1;
  overflow: hidden;
  background: white;
  border: 1px solid var(--borde);
  border-radius: 8px;
}

.history-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.history-table thead {
  background: #eaf3f3;
}

.history-table th {
  color: var(--azul-oscuro);
  font-size: clamp(9px, .9vw, 12px);
  text-transform: uppercase;
  letter-spacing: .5px;
  padding: clamp(6px, 1vh, 10px);
  text-align: center;
}

.history-table td {
  border-top: 1px solid #edf0f0;
  padding: clamp(5px, .85vh, 9px);
  font-size: clamp(11px, 1.1vw, 15px);
  text-align: center;
  overflow-wrap: anywhere;
}

.history-table td:first-child {
  color: var(--azul-oscuro);
  font-weight: 900;
}

.history-table td:last-child {
  color: #8b6a2d;
  font-weight: 800;
}

.history-empty {
  color: var(--gris) !important;
  font-weight: 400 !important;
  padding: 14px 5px !important;
}

/* POP-UP DE LLAMADO: NO ALTERA EL LAYOUT */

.call-popup {
  position: fixed;
  z-index: 1000;
  top: 50%;
  left: 50%;
  width: min(900px, 90vw);
  padding: clamp(20px, 4vh, 38px) 24px;
  transform: translate(-50%, -50%);
  border: 3px solid var(--dorado);
  border-radius: 18px;
  background: var(--azul);
  color: var(--dorado);
  box-shadow: 0 18px 80px #0008;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
}

.call-popup.show {
  visibility: visible;
  animation: popup-in-out 3s ease-in-out both;
}

.call-popup .popup-title {
  font-size: clamp(16px, 2.5vw, 28px);
  font-weight: 900;
  letter-spacing: 2px;
}

.call-popup .popup-message {
  margin-top: 14px;
  font-size: clamp(26px, 5.2vw, 65px);
  font-weight: 900;
  line-height: 1.15;
  overflow-wrap: anywhere;
}

@keyframes popup-in-out {
  0% {
    opacity: 0;
    visibility: visible;
    transform: translate(-50%, -46%) scale(.96);
  }
  12% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  83% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  100% {
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, -52%) scale(.99);
  }
}

/* AJUSTES DE ALTURA EN PANTALLAS BAJAS */

@media (max-height: 650px) {
  .turns-column {
    padding-top: 8px;
    padding-bottom: 8px;
    gap: 7px;
  }

  .screen-top {
    padding-bottom: 6px;
  }

  .turn-current {
    padding-top: 8px;
    padding-bottom: 8px;
  }

  .turn-current .current-code {
    font-size: clamp(34px, 5.5vh, 55px);
    margin: 3px 0;
  }

  .turn-current .current-mesa {
    font-size: clamp(16px, 2.7vh, 25px);
  }

  .history-table th,
  .history-table td {
    padding-top: 4px;
    padding-bottom: 4px;
  }
}

@media (max-width: 700px) {
  .main-header {
    padding: 12px;
  }

  .logo {
    height: 38px;
    max-width: 80px;
  }

  .brand h1 {
    font-size: 19px;
  }

  .brand p {
    font-size: 10px;
  }

  .header-link {
    font-size: 10px;
    padding: 8px;
  }

  .page {
    padding: 24px 13px 30px;
  }

  .card {
    padding: 21px 16px;
  }

  .auditorium {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }

  .video-column {
    padding: 6px;
  }

  .turns-column {
    padding: 8px;
    gap: 8px;
  }

  .screen-brand {
    gap: 5px;
  }

  .screen-brand .logo {
    max-width: 55px;
    height: 27px;
  }

  .screen-brand h1 {
    font-size: 14px;
  }

  .screen-brand p {
    font-size: 7px;
  }

  .clock-time {
    font-size: 16px;
  }

  .clock-date {
    font-size: 7px;
  }

  .turn-current .overline {
    font-size: 9px;
    letter-spacing: 1px;
  }

  .turn-current .current-code {
    font-size: clamp(30px, 5vw, 48px);
  }

  .turn-current .current-mesa {
    font-size: clamp(14px, 2.3vw, 23px);
  }

  .history-title h2 {
    font-size: 10px;
  }

  .history-table th {
    font-size: 8px;
  }

  .history-table td {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<header class="main-header" id="mainHeader">
  <div class="brand">
    <img class="logo" src="logo.png" alt="Seguros Nur"
         onerror="this.style.display='none'">
    <div>
      <h1>Seguros Nur</h1>
      <p>Protegiendo tu futuro a cada instante</p>
    </div>
  </div>
  <a class="header-link" href="#asesor">Acceso asesores</a>
</header>

<main id="app"></main>

<footer id="mainFooter">Seguros Nur · Sistema de turnos</footer>

<!-- Popup compartido, independiente del contenido para no moverlo -->
<div class="call-popup" id="callPopup" aria-live="assertive" aria-atomic="true">
  <div class="popup-title">NUEVO LLAMADO</div>
  <div class="popup-message" id="popupMessage">TURNO S-001 ➔ MESA 1</div>
</div>

<script>
"use strict";

/* ======================================================
   CONFIGURACIÓN
====================================================== */

const SUPABASE_URL =
  "https://wxkqmksukysajwnqkhhn.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_dWqEf88fb8BkN6G_mL911g_E2YOxIqp";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const app = document.getElementById("app");
const mainHeader = document.getElementById("mainHeader");
const mainFooter = document.getElementById("mainFooter");
const popup = document.getElementById("callPopup");
const popupMessage = document.getElementById("popupMessage");

const seguros = Array.from({ length: 8 }, (_, i) => ({
  numero: i + 1,
  nombre: `Seguro ${i + 1}`
}));

const state = {
  ruta: "",
  asesorAutenticado: false,
  mesaAsesor: 1,
  creando: false,
  llamando: false,
  canal: null,
  relojTimer: null,
  videoIndice: 0,
  popupTimer: null,
  ultimoPopupKey: "",
  llamadas: [],
  cargandoHistorial: false,
  historialPendiente: false
};

const videos = [
  "publicidad.mp4",
  "segurovehicular.mp4"
];

/* ======================================================
   UTILIDADES
====================================================== */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function seguroValido(nombre) {
  return seguros.some(s => s.nombre === nombre);
}

function mostrarMensaje(texto, tipo = "info", destino = "alertas") {
  const el = document.getElementById(destino);
  if (!el) return;

  el.innerHTML = `
    <div class="alert ${tipo}" role="status">
      ${escapeHTML(texto)}
    </div>
  `;
}

function limpiarMensaje(destino = "alertas") {
  const el = document.getElementById(destino);
  if (el) el.innerHTML = "";
}

function describirError(error) {
  console.error("[Seguros Nur]", error);

  if (!navigator.onLine) {
    return "No hay conexión a Internet. Comprueba tu conexión.";
  }

  if (error?.code === "42501") {
    return "Permiso denegado por Supabase. Revisa las políticas RLS.";
  }

  if (error?.code === "PGRST202" || error?.code === "42883") {
    return "No se encuentra una función SQL necesaria. Revisa la configuración de Supabase.";
  }

  return error?.message || "No se pudo completar la operación.";
}

function obtenerRuta() {
  if (location.hash.toLowerCase() === "#asesor") return "asesor";
  if (location.hash.toLowerCase() === "#pantalla") return "pantalla";
  return "cliente";
}

/* ======================================================
   NAVEGACIÓN
====================================================== */

function detenerCanal() {
  if (state.canal) {
    db.removeChannel(state.canal);
    state.canal = null;
  }
}

function detenerReloj() {
  if (state.relojTimer !== null) {
    clearInterval(state.relojTimer);
    state.relojTimer = null;
  }
}

function navegar() {
  const siguiente = obtenerRuta();

  if (state.ruta === "pantalla" && siguiente !== "pantalla") {
    detenerCanal();
    detenerReloj();
  }

  state.ruta = siguiente;

  document.body.classList.toggle("screen-mode", siguiente === "pantalla");
  mainHeader.classList.toggle("hidden", siguiente === "pantalla");
  mainFooter.classList.toggle("hidden", siguiente === "pantalla");

  if (siguiente === "cliente") renderCliente();
  if (siguiente === "asesor") renderAsesor();
  if (siguiente === "pantalla") renderPantalla();
}

window.addEventListener("hashchange", navegar);

/* ======================================================
   VISTA CLIENTE
====================================================== */

function renderCliente() {
  detenerCanal();

  app.className = "page";

  app.innerHTML = `
    <section class="heading">
      <div class="eyebrow">Bienvenido a Seguros Nur</div>
      <h2>Obtén tu turno</h2>
      <p>Selecciona el seguro que deseas consultar.</p>
    </section>

    <section class="card">
      <div class="field">
        <label for="seguroCliente">Tipo de seguro</label>
        <select id="seguroCliente">
          ${seguros.map(s => `
            <option value="${s.numero}">${s.nombre}</option>
          `).join("")}
        </select>
      </div>

      <button class="btn btn-gold" id="btnObtener">
        OBTENER MI TURNO
      </button>

      <div id="alertas" aria-live="polite"></div>
      <div id="resultadoTurno"></div>

      <p class="helper">
        Conserva tu número y permanece atento a la pantalla del auditorio.
      </p>
    </section>
  `;
  document.getElementById("btnObtener").addEventListener("click", obtenerTurno);
}

async function obtenerTurno() {
  if (state.creando) return;

  const boton = document.getElementById("btnObtener");
  const numeroSeguro = Number(document.getElementById("seguroCliente").value);
  const seguro = seguros.find(s => s.numero === numeroSeguro);

  if (!seguro) {
    mostrarMensaje("Selecciona un seguro válido.", "error");
    return;
  }

  state.creando = true;
  boton.disabled = true;
  boton.textContent = "GENERANDO TURNO...";
  limpiarMensaje();

  try {
    /*
     * Función SQL requerida:
     * crear_turno_global(p_seguro)
     *
     * La función genera S-001, S-002, S-003...
     * de forma transaccional y global.
     */
    const { data, error } = await db.rpc("crear_turno_global", {
      p_seguro: seguro.nombre
    });

    if (error) throw error;

    const turno = Array.isArray(data) ? data[0] : data;

    if (!turno?.codigo_formateado) {
      throw new Error("No se recibió el código del turno.");
    }

    document.getElementById("resultadoTurno").innerHTML = `
      <div class="ticket-result">
        <div class="label">TU NÚMERO DE TURNO</div>
        <div class="code">${escapeHTML(turno.codigo_formateado)}</div>
        <strong>${escapeHTML(turno.seguro)}</strong>
        <p>Estado: En espera</p>
        <p>Espera a que tu turno aparezca en la pantalla.</p>
      </div>
    `;

    mostrarMensaje("Tu turno fue generado correctamente.", "success");
    boton.textContent = "TURNO GENERADO";

  } catch (error) {
    mostrarMensaje(describirError(error), "error");
    boton.disabled = false;
    boton.textContent = "INTENTAR NUEVAMENTE";
  } finally {
    state.creando = false;
  }
}

/* ======================================================
   VISTA ASESORES
====================================================== */

function renderAsesor() {
  detenerCanal();
  app.className = "page";

  if (!state.asesorAutenticado) {
    app.innerHTML = `
      <section class="heading">
        <div class="eyebrow">Acceso restringido</div>
        <h2>Portal de asesores</h2>
        <p>Ingresa la clave para gestionar la cola de atención.</p>
      </section>

      <section class="card">
        <form id="formLogin">
          <div class="field">
            <label for="clave">Clave de acceso</label>
            <input id="clave" type="password" inputmode="numeric"
                   autocomplete="current-password" required
                   placeholder="Ingresa tu clave">
          </div>
          <button class="btn btn-blue" type="submit">INICIAR SESIÓN</button>
          <div id="alertas" aria-live="polite"></div>
        </form>
      </section>
    `;

    document.getElementById("formLogin").addEventListener("submit", event => {
      event.preventDefault();

      if (document.getElementById("clave").value === "1234") {
        state.asesorAutenticado = true;
        renderAsesor();
      } else {
        mostrarMensaje("Clave incorrecta.", "error");
        document.getElementById("clave").value = "";
      }
    });

    return;
  }

  app.innerHTML = `
    <section class="heading">
      <div class="eyebrow">Panel operativo</div>
      <h2>Gestión de turnos</h2>
      <p>Selecciona la mesa y llama al siguiente cliente.</p>
    </section>

    <section class="card">
      <div class="status-line">
        <span class="dot"></span>
        <span>Panel de atención activo</span>
      </div>

      <div class="field">
        <label for="mesaAsesor">Mesa de atención</label>
        <select id="mesaAsesor">
          ${Array.from({ length: 8 }, (_, i) => `
            <option value="${i + 1}" ${state.mesaAsesor === i + 1 ? "selected" : ""}>
              Mesa ${i + 1}
            </option>
          `).join("")}
        </select>
      </div>

      <div class="current-advisor">
        <div class="label">Último turno llamado por esta sesión</div>
        <div class="code" id="turnoAsesor">—</div>
        <div id="mesaActual">Mesa ${state.mesaAsesor}</div>
      </div>

      <button class="btn btn-blue" id="btnLlamar">
        LLAMAR SIGUIENTE TURNO
      </button>

      <div id="alertas" aria-live="polite"></div>

      <div style="margin-top:14px">
        <button class="btn btn-light" id="btnSalir">CERRAR SESIÓN</button>
      </div>

      <p class="helper">
        Se llamará al turno más antiguo en espera de toda la feria,
        independientemente del seguro.
      </p>
    </section>
  `;

  document.getElementById("mesaAsesor").addEventListener("change", event => {
    state.mesaAsesor = Number(event.target.value);
    document.getElementById("mesaActual").textContent = `Mesa ${state.mesaAsesor}`;
    limpiarMensaje();
  });

  document.getElementById("btnLlamar").addEventListener("click", llamarSiguiente);

  document.getElementById("btnSalir").addEventListener("click", () => {
    state.asesorAutenticado = false;
    renderAsesor();
  });
}

async function llamarSiguiente() {
  if (!state.asesorAutenticado || state.llamando) return;

  const boton = document.getElementById("btnLlamar");
  const mesa = state.mesaAsesor;

  state.llamando = true;
  boton.disabled = true;
  boton.textContent = "LLAMANDO...";
  limpiarMensaje();

  try {
    /*
     * La función SQL bloquea la cola, selecciona el registro
     * en espera más antiguo por created_at y lo actualiza
     * junto con la mesa dentro de una única transacción.
     */
    const { data, error } = await db.rpc("llamar_siguiente_turno", {
      p_mesa: `Mesa ${mesa}`
    });

    if (error) throw error;

    const turno = Array.isArray(data) ? data[0] : data;

    if (!turno || !turno.codigo_formateado) {
      mostrarMensaje("No hay turnos en espera.", "info");
      return;
    }

    document.getElementById("turnoAsesor").textContent =
      turno.codigo_formateado;
    document.getElementById("mesaActual").textContent =
      turno.mesa || `Mesa ${mesa}`;

    mostrarMensaje(
      `Turno ${turno.codigo_formateado} asignado a ${turno.mesa || `Mesa ${mesa}`}.`,
      "success"
    );

  } catch (error) {
    mostrarMensaje(describirError(error), "error");
  } finally {
    state.llamando = false;

    const btn = document.getElementById("btnLlamar");
    if (btn) {
      btn.disabled = false;
      btn.textContent = "LLAMAR SIGUIENTE TURNO";
    }
  }
}

/* ======================================================
   RELOJ DE AUDITORIO
====================================================== */

function actualizarReloj() {
  const hora = document.getElementById("clockTime");
  const fecha = document.getElementById("clockDate");

  if (!hora || !fecha) return;

  const ahora = new Date();

  hora.textContent = new Intl.DateTimeFormat("es-BO", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).format(ahora);

  fecha.textContent = new Intl.DateTimeFormat("es-BO", {
    weekday: "long",
    day: "2-digit",
    month: "long",
    year: "numeric"
  }).format(ahora);
}

function iniciarReloj() {
  detenerReloj();
  actualizarReloj();
  state.relojTimer = setInterval(actualizarReloj, 1000);
}

/* ======================================================
   VIDEOS: PUBLICIDAD <-> SEGURO VEHICULAR
====================================================== */

function iniciarVideos() {
  const video = document.getElementById("videoPlayer");
  const mensaje = document.getElementById("videoMessage");

  if (!video) return;

  function cargarVideo(indice) {
    state.videoIndice = indice;
    video.src = videos[indice];
    video.load();

    const playPromise = video.play();

    if (playPromise && typeof playPromise.catch === "function") {
      playPromise.catch(error => {
        console.warn("No se pudo reproducir el video:", error);
        if (mensaje) {
          mensaje.classList.remove("hidden");
          mensaje.textContent =
            "Verifica que los videos existan y que el navegador permita reproducirlos.";
        }
      });
    }
  }

  video.onended = () => {
    cargarVideo((state.videoIndice + 1) % videos.length);
  };

  video.onerror = () => {
    if (mensaje) {
      mensaje.classList.remove("hidden");
      mensaje.textContent = `No se pudo cargar ${videos[state.videoIndice]}.`;
    }
  };

  cargarVideo(0);
}

/* ======================================================
   POP-UP: DURACIÓN EXACTA DE 3 SEGUNDOS
====================================================== */

function mostrarLlamado(turno) {
  const codigo = turno.codigo_formateado;
  const mesa = turno.mesa;

  if (!codigo || !mesa) return;

  const key = `${codigo}|${mesa}|${turno.created_at || ""}`;

  // Evita duplicar el mismo aviso si llega un evento repetido.
  if (key === state.ultimoPopupKey) return;
  state.ultimoPopupKey = key;

  popupMessage.textContent = `TURNO ${codigo} ➔ ${String(mesa).toUpperCase()}`;

  // Reinicia la animación incluso si llega otra llamada durante el aviso.
  popup.classList.remove("show");
  void popup.offsetWidth;
  popup.classList.add("show");

  if (state.popupTimer !== null) {
    clearTimeout(state.popupTimer);
  }

  state.popupTimer = setTimeout(() => {
    popup.classList.remove("show");
    state.popupTimer = null;
  }, 3000);
}

/* ======================================================
   ACTUALIZAR TURNO ACTUAL E HISTORIAL
====================================================== */

function pintarHistorial(llamadas) {
  const body = document.getElementById("historyBody");
  if (!body) return;

  const recientes = llamadas.slice(0, 5);

  if (recientes.length === 0) {
    body.innerHTML = `
      <tr>
        <td class="history-empty" colspan="2">Aún no hay turnos llamados</td>
      </tr>
    `;
    return;
  }

  body.innerHTML = recientes.map(turno => `
    <tr>
      <td>${escapeHTML(turno.codigo_formateado || "—")}</td>
      <td>${escapeHTML(turno.mesa || "—")}</td>
    </tr>
  `).join("");
}

function pintarActual(turno) {
  const codigo = document.getElementById("currentCode");
  const mesa = document.getElementById("currentMesa");
  const seguro = document.getElementById("currentSeguro");

  if (!codigo || !mesa || !seguro) return;

  if (!turno) {
    codigo.textContent = "---";
    mesa.textContent = "ESPERANDO LLAMADO";
    seguro.textContent = "Seguros Nur · Atención al cliente";
    return;
  }

  codigo.textContent = turno.codigo_formateado || "---";
  mesa.textContent = turno.mesa || "MESA NO ASIGNADA";
  seguro.textContent = turno.seguro || "Seguros Nur";
}

async function cargarHistorial() {
  if (state.ruta !== "pantalla") return;

  if (state.cargandoHistorial) {
    state.historialPendiente = true;
    return;
  }

  state.cargandoHistorial = true;

  try {
    /*
     * No se consulta id.
     * Se ordena de manera ascendente por created_at,
     * tal como se requiere, y luego se invierte en JavaScript
     * para mostrar primero las llamadas más recientes.
     */
    const { data, error } = await db
      .from("turnos")
      .select("seguro, estado, codigo_formateado, created_at, mesa")
      .eq("estado", "atendiendo")
      .order("created_at", { ascending: true })
      .limit(500);

    if (error) throw error;

    const llamadas = (data || [])
      .filter(turno => turno.codigo_formateado && turno.mesa)
      .reverse();

    state.llamadas = llamadas;

    const actual = llamadas[0] || null;
    pintarActual(actual);
    pintarHistorial(llamadas);

    const label = document.getElementById("connectionLabel");
    if (label) label.textContent = "En vivo";

  } catch (error) {
    console.error(error);

    const label = document.getElementById("connectionLabel");
    if (label) label.textContent = "Error de conexión";

    const body = document.getElementById("historyBody");
    if (body && state.llamadas.length === 0) {
      body.innerHTML = `
        <tr>
          <td class="history-empty" colspan="2">No se pudo cargar el historial</td>
        </tr>
      `;
    }
  } finally {
    state.cargandoHistorial = false;

    if (state.historialPendiente) {
      state.historialPendiente = false;
      cargarHistorial();
    }
  }
}

/* ======================================================
   SUPABASE REALTIME
====================================================== */

function iniciarRealtime() {
  detenerCanal();

  // Carga inicial antes de escuchar eventos nuevos.
  cargarHistorial();

  state.canal = db
    .channel("turnos-realtime")
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "turnos"
      },
      payload => {
        if (state.ruta !== "pantalla") return;

        const nuevo = payload.new;

        /*
         * El popup aparece cuando se inserta o actualiza un
         * registro que ya está en estado atendiendo y tiene mesa.
         * El cambio de estado es el evento principal de llamada.
         */
        if (
          nuevo &&
          nuevo.estado === "atendiendo" &&
          nuevo.codigo_formateado &&
          nuevo.mesa
        ) {
          const anterior = payload.old || {};

          const cambioAAtendiendo =
            payload.eventType === "INSERT" ||
            anterior.estado !== "atendiendo" ||
            anterior.mesa !== nuevo.mesa;

          if (cambioAAtendiendo) {
            mostrarLlamado(nuevo);
          }
        }

        cargarHistorial();
      }
    )
    .subscribe(status => {
      if (state.ruta !== "pantalla") return;

      const label = document.getElementById("connectionLabel");

      if (status === "SUBSCRIBED") {
        if (label) label.textContent = "En vivo";
        cargarHistorial();
      } else if (
        status === "CHANNEL_ERROR" ||
        status === "TIMED_OUT" ||
        status === "CLOSED"
      ) {
        if (label) label.textContent = "Reconectando...";
      }
    });
}
